server {
    listen 80;
    server_name iptv.czghq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://iptv.czghq.com$request_uri;
    }
}

server {
    listen 15110 ssl http2;
    listen [::]:15110 ssl http2;
    server_name iptv.czghq.com;

    ssl_certificate /etc/letsencrypt/live/iptv.czghq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv.czghq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
