# iptv.czghq.com —— 80 明文入口 + 15110 的 HTTPS 站点
#
# 背景：Cloudflare 这个 zone 的边缘只提供 ECDSA 证书/套件，而 Android 4.2 一类的
# 老设备 TLS 栈只有 RSA 套件，握手必然 handshake_failure（error 14077410）。
# 所以给老设备单独留一条纯 HTTP 的路：80 端口直接反代，并把 m3u 里的 https 改写成 http。
#
# 前提（缺一不可）：
#   1. Cloudflare 后台 SSL/TLS → 边缘证书 → “始终使用 HTTPS” 必须保持关闭，
#      否则 80 会被 301 回 https，老设备又回到 TLS 问题；
#   2. 15110 的 HTTPS 站点继续保留，手机/新盒子走 https 不受影响；
#   3. /admin 强制跳 https，避免后台被明文访问。
#
# 部署路径：/usr/local/nginx/conf/vhost/iptv.czghq.com.conf
# 改完执行：/usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
# 关联：443 由 nginx 的 stream 块按 SNI 分流到 127.0.0.1:15110（见 nginx.conf）

server {
    listen 80;
    server_name iptv.czghq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 后台走 https，别在明文口暴露
    location ^~ /admin {
        return 301 https://iptv.czghq.com$request_uri;
    }

    # 其余路径明文输出，内含 m3u 地址改写
    location / {
        proxy_pass http://127.0.0.1:2086;
        proxy_http_version 1.1;
        proxy_set_header Host iptv.czghq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        # 必须关掉上游压缩，否则 sub_filter 改不了内容
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        sub_filter 'https://iptv.czghq.com' 'http://iptv.czghq.com';
        sub_filter_once off;
        sub_filter_types text/plain text/xml application/xml application/vnd.apple.mpegurl application/x-mpegurl application/json;
    }
}

server {
    listen 15110 ssl http2;
    listen [::]:15110 ssl http2;
    server_name iptv.czghq.com;

    ssl_certificate /etc/letsencrypt/live/iptv.czghq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv.czghq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
