services:
  iptv:
    image: ghq200101/iptv:latest
    container_name: iptv
    init: true
    ports:
      - "25011:25011"
    environment:
      - "mport=25011"
      - "mdataDir=/iptv/data"
      - "mhost=http://192.168.1.4:25011"
      # - "mpass=change-this-password"
      # - "mblank=true"
      # - "menableMigu=true"
      # - "menableBuiltInSources=true"
      # - "menableBuiltInSubscriptions=true"
      # - "mbrowserConcurrency=2"
    volumes:
      - "./data:/iptv/data"
    restart: always
