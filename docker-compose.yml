services:
  iptv:
    image: ghq200101/iptv:latest
    container_name: iptv
    init: true
    ports:
      - "52011:52011"                             # 宿主机:容器端口映射
    environment:
      # - muserId=                               # 可选：咪咕账号ID；建议在后台登录，不要提交凭据
      # - mtoken=                                # 可选：咪咕登录令牌；建议在后台登录，不要提交凭据
      # - mSichuanAccessToken=                  # 可选：四川广电官网登录令牌；也可在后台源管理中填写
      - mport=52011                             # 必须：容器监听端口，与 ports 对应
      - mhost=http://104.168.202.248:52011      # 可选：外部访问地址（如 http://192.168.1.100:1905）
      - mrateType=3                             # 画质：2=标清(480p)，3=高清(720p)，4=蓝光(1080p,需VIP)
      - mpass=                                  # 可选：访问密码（设置后访问: http://ip:port/密码/...）
      - menableHDR=true                         # 可选：是否开启HDR
      - menableH265=true                        # 可选：是否开启H265原画（可能有兼容性问题）
      - mupdateInterval=6                       # 可选：节目信息更新间隔（小时）
      # - mexternalLogoBase=https://gcore.jsdelivr.net/gh/taksssss/tv@main/icon/   # 可选：外部/抓取频道无台标时按名兜底的台标库地址（默认 taksssss 台标库的 jsDelivr 镜像，大陆可达）；留空关闭
      # - mexternalLogoIndex=https://gcore.jsdelivr.net/gh/taksssss/tv@main/iconList_default.json   # 可选：台标库索引（有它才知道库里有没有这张图，没有就留空而不是写个 404 地址）；换了台标库又没有索引时留空
      # ---- 内容开关（默认全开，老用户无需理会；任一设 false 即关闭对应内容）----
      # - mblank=true                           # 空白模式总开关：开启后下面三项「默认」关闭（一行得到空白部署）；可叠加 menableMigu=true 等单独开回
      # - menableMigu=true                      # 咪咕源（核心：CCTV/卫视抓取 + 体育赛事 + EPG），关闭后仅用内置/外部源
      # - menableBuiltInSources=true            # 内置单频道源（纬来体育/Red Bull/4K卫视 等）
      # - menableBuiltInSubscriptions=true      # 内置订阅源（精选频道），关闭后不加入且已删除的不再复活
      # - mbrowserConcurrency=2                 # 可选：同时允许存活的无头 Chromium 数（默认 2）。内存 ≤2G 的 NAS/小主机建议设 1；每个 Chromium 约占 200~400MB，开多了会把机器拖进交换、表现为卡死 + 硬盘狂读写
      - mdataDir=/iptv/data                      # 配置/数据持久化目录（对应下方挂载的卷）
    volumes:
      - "./data:/iptv/data"
    restart: always
