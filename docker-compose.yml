services:
  iptv:
    image: ghq200101/iptv:latest
    container_name: iptv
    init: true
    ports:
      - "52011:52011"
    environment:
      - "mport=52011"
      - "mdataDir=/iptv/data"
      - "mhost=http://czghq.com:52011"
      # - "mpass=change-this-password"
      # - "mblank=true"
      # - "menableMigu=true"
      # - "menableBuiltInSources=true"
      # - "menableBuiltInSubscriptions=true"
      # - "mbrowserConcurrency=2"
    volumes:
      - "./data:/iptv/data"
    restart: always
